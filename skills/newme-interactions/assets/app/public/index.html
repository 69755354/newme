<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>newme interactions</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><a href="#">newme <span>interactions</span></a><span class="tag">LOCAL · OPEN SOURCE</span></header>
<section class="intro"><p class="eyebrow">给电脑一点反馈</p><h1>拍一下，叫一声。</h1><p>催工有惨叫，鼓励有掌声。浏览器就能玩，不需要 GPT 账号。</p></section>
<section class="scene" id="stage" data-action="idle" aria-label="互动动画：老板与机器人同事">
<svg viewBox="0 0 800 340" role="img" aria-label="粉色衣服的老板和工作的机器人"><path class="room" d="M40 295H760M75 70H725V295H75Z"/><path class="window" d="M465 90H690V205H465ZM540 90V205M615 90V205"/><g class="boss"><path class="boss-body" d="M216 160L192 228H266L246 160Z"/><path class="limb" d="M210 225L202 280M249 225L261 280"/><path class="hair" d="M202 135Q192 83 229 83Q270 83 257 140Z"/><ellipse class="face" cx="229" cy="125" rx="22" ry="29"/><path class="arm" d="M246 176L280 145L294 124"/><path class="other-arm" d="M211 175L184 197"/><path class="whip" d="M295 124Q385 65 421 166Q451 238 514 205"/></g><g class="worker"><path class="robot-body" d="M535 189H603V247H535Z"/><rect class="robot-head" x="529" y="137" width="81" height="57" rx="13"/><circle class="eye" cx="551" cy="162" r="5"/><circle class="eye" cx="589" cy="162" r="5"/><path class="mouth" d="M558 179H580"/><path class="limb" d="M547 243L540 280M589 243L600 280"/></g><path class="desk" d="M460 233H675V247H460ZM482 247V291M651 247V291"/><rect class="screen" x="614" y="171" width="47" height="52" rx="3"/><path class="screen-stand" d="M637 224V233"/><g class="cheers"><path d="M342 115L356 93M367 127L395 115M328 101L326 74M441 147L453 132"/></g><text class="yelp" x="453" y="115">嗷！</text><text class="praise" x="315" y="83">做得好</text></svg>
<div class="action-buttons"><button id="whip" class="primary">挥鞭催工</button><button id="encourage">鼓励 · 鼓掌</button><button id="test">模拟拍击</button></div></section>
<section class="controls"><div class="control-heading"><h2>拍击与声音</h2><button id="microphone" aria-pressed="false">开启拍击识别</button></div><p id="status" role="status">识别默认关闭。开启后，关闭此页面即可停止。</p><div class="ranges"><label>音量<input id="volume" type="range" min="0" max="100" value="35"><output id="volume-value">35%</output></label><label>灵敏度<input id="sensitivity" type="range" min="1" max="5" value="3"><output id="sensitivity-value">3/5</output></label><label class="mute"><input id="mute" type="checkbox">静音</label></div><p class="hint">麦克风识别的是短促冲击声，无法保证区分每一次打字、拍手和机身轻拍。误触时降低灵敏度。轻拍掌托即可。</p></section>
<details class="feedback"><summary>把“不满意”交给自己的工具</summary><p id="feedback-mode">读取接收器设置中…</p><label for="feedback-message">返工要求</label><textarea id="feedback-message" rows="4" maxlength="2000">我对当前结果不满意。请重新对照原来的目标，检查漏项和未验证的部分，修正后再交付。信息不足时只问最关键的问题。</textarea><label class="auto"><input id="feedback-auto" type="checkbox">拍击时自动发送这段要求给配置的接收器</label><div class="feedback-actions"><button id="send">发送到接收器</button><button id="copy">复制返工要求</button></div><p id="feedback-status" role="status">挥鞭、鼓励和模拟拍击不会发送反馈。</p></details>
<footer>源码与接入方法见项目 README · 音频在本机处理 · 无运行时第三方依赖</footer></main><script type="module" src="./app.js"></script></body></html>
